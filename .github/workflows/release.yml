# Release: build probaci's binaries and publish them on its GitHub release, and nowhere else (no
# `go install` path, Homebrew, Scoop, Winget, image or any other channel; owner, 2026-11-13).
# The pipeline is simtabi/.github's shared go-release.yml; this file only says when.
#
#   git push origin vX.Y.Z                                              builds and publishes vX.Y.Z
#   gh workflow run release.yml --repo simtabi/probaci -f tag=vX.Y.Z    the same, for a tag already pushed
#
# Push a version tag only for final code: tags are final, and a pushed tag publishes. The shared
# workflow reads src/.goreleaser.yaml (dist: .cache/goreleaser, cosign-signed checksums), takes the
# notes from the tag's CHANGELOG.md section and pushes the src/vX.Y.Z module tag, which matches no
# trigger here. Go comes from .go-version, the one Go version ci.yml and codeql.yml install too,
# rather than src/go.mod, whose `go 1.26.0` would pin the build to the first 1.26 release.
# src/internal/release's TestReleaseRunsOnAVersionTagOrOnRequest fails if a trigger is added or the
# job stops calling the shared workflow.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing vX.Y.Z tag to build and publish'
        required: true
        type: string

permissions: {}

# One run per tag, never cancelled: two runs must not publish the same release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: simtabi/.github/.github/workflows/go-release.yml@767e0c01251dbbfc695d03dfdd73db48733e852e  # v1.0.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      go-version-file: .go-version
