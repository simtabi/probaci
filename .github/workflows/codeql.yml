name: codeql

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1" # Monday 06:30 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: src/go.sum
      # The module lives in src/, which autobuild does not look for: manual mode
      # builds it explicitly, so the scan never reports clean on zero code.
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - run: go -C src build ./...
      - uses: github/codeql-action/analyze@v4
