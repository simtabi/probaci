# Run from the repository root: goreleaser ... --config src/.goreleaser.yaml.
# The module lives in src/ (builds[].dir), and archive files (LICENSE, README)
# are read from the root, which a config run from inside src/ cannot reach.
#
# GoReleaser configuration — cross-platform/arch builds, checksums, cosign
# signing, SLSA provenance, and an SBOM per release.
version: 2

project_name: probaci

# GoReleaser writes into a scratch dist, .cache/goreleaser/ (gitignored), never
# into build/. build/ holds one folder per OS and nothing else; `make cross` and
# `make dist` write it with src/scripts/build-all.sh. A release (simtabi/.github's
# go-release.yml) uploads straight from this dist, so release assets stay flat.
dist: .cache/goreleaser

before:
  hooks:
    - go -C src mod tidy

builds:
  - id: probaci
    dir: src
    main: ./cmd/probaci
    binary: probaci
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/simtabi/probaci/src/internal/version.Version={{.Version}}
      - -X github.com/simtabi/probaci/src/internal/version.Commit={{.ShortCommit}}
      - -X github.com/simtabi/probaci/src/internal/version.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: ["amd64", "arm64", "arm", "386"]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm

# A single macOS universal binary (amd64 + arm64) alongside the per-arch ones.
universal_binaries:
  - id: probaci
    ids: [probaci]
    name_template: probaci
    replace: false

# All artifacts use one flat, versionless, Go-style naming scheme:
#   probaci_<os>_<arch>[.ext]  with darwin → macos, e.g.
#   probaci_macos_arm64, probaci_linux_amd64, probaci_windows_386.exe,
#   probaci_macos_universal, probaci_linux_armv7.
# The release tag carries the version. install scripts reconstruct these names.
archives:
  - id: binary
    ids: [probaci]
    formats: [binary]
    name_template: &name >-
      probaci_{{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "all" }}universal{{ else if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}

  - id: archive
    ids: [probaci]
    name_template: *name
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - third-party-notices.md

# Native Linux packages (nfpm operates on the Linux builds only).
nfpms:
  - id: packages
    ids: [probaci]
    package_name: probaci
    formats: [deb, rpm, apk]
    maintainer: "Imani Manyara <imani@simtabi.com>"
    vendor: "Simtabi LLC"
    homepage: "https://opensource.simtabi.com/products/probaci"
    description: "Prove your CI pipeline before you push."
    license: MIT
    bindir: /usr/bin
    file_name_template: 'probaci_linux_{{ if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}'

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Local `goreleaser release --snapshot` (see `make bundle`) gets a sane version.
snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

# Reproducible source tarball, uploaded as a first-class release asset next to
# GitHub's auto-generated "Source code" links, so every release ships the exact
# code as well as the binaries.
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# One SBOM per archive (syft, SPDX-JSON), attached as release assets so
# consumers can audit the supply chain of what they download.
sboms:
  - id: archive
    artifacts: archive

# Keyless cosign signing of the checksums file (release CI only; skipped in
# snapshot/bundle). OIDC provides the identity.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# The GitHub release is the only channel (owner, 2026-11-13): no homebrew_casks, scoops, winget
# or any other publishing block. No probaci release ever reached the tap, bucket or Winget, so
# nothing is left there to freeze. simtabi/.github's
# go-release.yml refuses this config if one of those blocks comes back, and
# src/internal/release's TestGoReleaserPublishesNowhereElse fails first.

release:
  github:
    owner: simtabi
    name: probaci
