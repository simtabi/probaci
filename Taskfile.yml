# Dev tasks for probaci, for anyone who prefers `task <name>`
# (https://taskfile.dev). Every task forwards to the Makefile, which is the one
# definition: the module lives in src/ and build/ holds one folder per OS, and
# keeping those rules in one file is what stops the two from drifting.
version: "3"

tasks:
  default:
    cmds: [task: build]

  build:
    desc: Build build/<host-os>/probaci (version-stamped)
    cmds: [make build]

  install:
    desc: Install probaci into GOBIN from this checkout
    cmds: [make install]

  run:
    desc: Run probaci from source (pass args after --)
    cmds:
      - go -C src run ./cmd/probaci {{.CLI_ARGS}}

  test:
    desc: Run the test suite with the race detector
    cmds: [make test]

  cover:
    desc: Run tests with coverage
    cmds: [make cover]

  vet:
    desc: Run go vet
    cmds: [make vet]

  lint:
    desc: Run golangci-lint (must be installed)
    cmds: [make lint]

  fmt:
    desc: Format the codebase
    cmds: [make fmt]

  tidy:
    desc: Tidy src/go.mod and src/go.sum
    cmds: [make tidy]

  cross:
    desc: Cross-compile every target in build/targets.txt into build/<os>/
    cmds: [make cross]

  dist:
    desc: cross, plus archives in build/archives/ (publishes nothing)
    cmds: [make dist]

  check-build:
    desc: Fail when build/ holds anything but the OS folders, inputs and checksums
    cmds: [make check-build]

  sync-docs:
    desc: Copy README.md and docs/ into src/embedded/ for `probaci docs`
    cmds: [make sync-docs]

  release-check:
    desc: Validate the GoReleaser configuration
    cmds: [make release-check]

  bundle:
    desc: Local GoReleaser snapshot into .cache/goreleaser (publishes nothing)
    cmds: [make bundle]

  snapshot:
    desc: Alias for `bundle`
    cmds: [make snapshot]

  clean:
    desc: Remove build artifacts
    cmds: [make clean]
