name: ci

on:
  pull_request:

# Least privilege by default; jobs opt into more if needed.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every action reference must match the org pinning rule, offline and exactly: a third-party
      # action on the commit SHA of a named release, a first-party one (actions/, docker/, github/)
      # floating on its current major. Whether that release is the newest is Dependabot's job and
      # laranail/package-tools' verify-action-pins.py; nothing checked the *shape* until this step,
      # which is how the references here drifted off it with every check staying green.
      - name: Action pins match the rule
        run: |
          python3 - <<'PINS'
          import os, re, sys
          d = ".github/workflows"
          files = sorted(f for f in os.listdir(d) if f.endswith((".yml", ".yaml")))
          floor = 5
          if len(files) < floor:
              sys.exit(f"{len(files)} workflow files in {d}; floor is {floor}. "
                       "A search that stops matching must fail, not report a clean repository.")
          uses = re.compile(r"uses:\s*([\w.-]+/[\w./-]+?)@([\w./-]+?)([ \t]*#[ \t]*(\S+))?\s*$", re.M)
          bad, seen = [], 0
          for name in files:
              for ref, at, _, note in uses.findall(open(os.path.join(d, name)).read()):
                  if ref.startswith("./") or "/.github/workflows/" in ref:
                      continue                      # a local action or a reusable-workflow call
                  seen += 1
                  if ref.startswith(("actions/", "docker/", "github/")):
                      if not re.fullmatch(r"v\d+", at) or note:
                          bad.append(f"{name}: {ref}@{at} -- first-party, so float on a bare major tag")
                  elif not re.fullmatch(r"[0-9a-f]{40}", at):
                      bad.append(f"{name}: {ref}@{at} -- third-party, so pin to a commit SHA")
                  elif not note or re.fullmatch(r"v?\d+", note):
                      bad.append(f"{name}: {ref}@{at[:12]} # {note} -- name the release, not a mutable major")
          print("\n".join(f"  {b}" for b in bad))
          print(f"{seen} action references in {len(files)} workflow files; {len(bad)} off the rule")
          sys.exit(1 if bad else 0)
          PINS
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          check-latest: true
          cache-dependency-path: src/go.sum
      # The module lives in src/: a bare `go test ./...` at the root finds no
      # packages and passes, so every command names it.
      - run: go -C src build ./...
      - run: go -C src vet ./...
      - run: go -C src test -race -coverprofile=../coverage.txt ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: src

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/go.sum
      # Pinned: govulncheck @latest (v1.4.0) segfaults under the go1.25 toolchain.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: |
          cd src && "$(go env GOPATH)/bin/govulncheck" ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/go.sum
      # Build gosec with the runner's Go — the gosec docker action bundles an
      # older Go that cannot load a `go 1.24` module.
      # probaci is a CI orchestrator: it runs subprocesses (G204) and reads/writes
      # user-named files (G304/G306) with conventional perms (G301/G302) by
      # design, and G104 duplicates errcheck. The high-severity taint rules
      # (G702/G703) stay on, with #nosec on the few benign sites.
      # Pinned, not @latest: gosec v2.30.0 requires go >= 1.26 and fails to
      # install on this job's Go 1.25 (GOTOOLCHAIN=local). v2.29.0 is the
      # newest release whose go.mod accepts 1.25; bump with the go-version.
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: |
          cd src && "$(go env GOPATH)/bin/gosec" -exclude=G104,G204,G301,G302,G304,G306 ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/go.sum
      # Run gitleaks directly (the gitleaks-action requires a paid license for
      # org repos). Scans the working tree and honors .gitleaks.toml. Built from
      # source at a named release rather than run from a container image, which
      # this repository no longer uses anywhere.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: |
          "$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact --exit-code 1

  # Dogfood: probaci proves itself. Scoped to the platform/security stages that
  # aren't already covered by the dedicated jobs above (lint/govulncheck/gosec/
  # gitleaks run separately), so this stays fast and non-duplicative.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/go.sum
      # go -C src starts probaci inside src/; it walks up to the git root and
      # proves the whole repository, as it did from the root.
      - run: go -C src run ./cmd/probaci run --ci --only detect,workflow-lint,versions,secrets
      # The module lives in src/, not at the root. Detection once missed it and
      # reported languages=[] while every stage still passed, so assert it.
      - name: Self-test detects Go in src/
        run: |
          out=$(go -C src run ./cmd/probaci run --ci --only detect 2>&1)
          echo "$out"
          echo "$out" | grep -q 'languages=\[go\]' || { echo "::error::probaci did not detect its own Go module in src/"; exit 1; }

  # Cross-compile every target into build/<os>/ on every pull request (and on
  # demand) and attach the binaries to the run, so a reviewer can try the exact
  # binaries before merging. It builds with src/scripts/build-all.sh and
  # publishes nothing; no GoReleaser runs here. `make cross` ends with
  # `make check-build`, so a stray file in build/ fails the job.
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: src/go.sum
      - run: make cross
      - run: cd build && sha256sum -c checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: "probaci-snapshot-${{ github.event.pull_request.number || github.run_id }}"
          if-no-files-found: error
          retention-days: 14
          path: |
            build/*/probaci_*
            build/checksums.txt
